const num = (v, d = 0) => v == null ? '—' : Number(v).toLocaleString('uk-UA', { minimumFractionDigits: d, maximumFractionDigits: d }).replace('-', '−');
const pct = (v, d = 1) => v == null ? '—' : `${num(v, d)} %`;
const pp = d => d == null ? '' : Math.abs(d) < 0.05 ? 'без змін' : `${d > 0 ? '+' : '−'}${num(Math.abs(d), 1)} п.п.`;
const plural = (n, a, b, c) => { const x = Math.abs(n) % 100, y = x % 10; return x > 10 && x < 20 ? c : y === 1 ? a : y >= 2 && y <= 4 ? b : c; };
const nw = (n, a, b, c) => `${num(n)} ${plural(n, a, b, c)}`;
const d2 = ts => ts ? new Date(ts * 1000).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit' }) : '—';
const dt = ts => ts ? `${d2(ts)}, ${new Date(ts * 1000).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })}` : '—';
const age = h => h < 48 ? nw(h, 'година', 'години', 'годин') : nw(Math.floor(h / 24), 'день', 'дні', 'днів');
const bname = v => { const p = v.split('.'); return p.length > 3 ? `${p.slice(0, 3).join('.')} · ${p.slice(3).join('.')}` : v; };
const short = v => v.split('.').slice(0, 3).join('.');
const shortc = v => { const p = v.split('.'); return p.length > 3 ? `${p.slice(0, 3).join('.')}·${p[3].slice(0, 8)}` : v; };
const STATUS = { good: 'Норма', warning: 'Погіршення', critical: 'Проблема', grey: 'Мало даних' };
const pill = (s, tip) => `<span class="pill ${s}" title="${esc(tip || '')}">${STATUS[s]}</span>`;
const TIER = { ultra: 'топове залізо', high: 'потужне залізо', mid: 'середнє залізо', low: 'слабке залізо' };
const TIER_TIP = 'Групу заліза (hw_tier) ставить бекенд телеметрії за обсягом відеопам’яті (SystemInfo.graphicsMemorySize): слабке < 2 ГБ · середнє 2–5 ГБ · потужне 5–11 ГБ · топове ≥ 11 ГБ. Лише VRAM, без моделі GPU/CPU: RTX 3060 12 ГБ потрапляє в «топове», RTX 3070 8 ГБ — у «потужне».';
const PHASE = { InSession: 'у грі', PreSession: 'до сесії (меню, завантаження)', Lobby: 'у лобі' };
const PLACE = p => { const m = (p || '').match(/^(\w+?)_L(\d+)$/); const nm = { Beach: 'пляж', Level: 'рівень', Shop: 'магазин', Castle: 'замок', Ship: 'корабель' };
  return m ? `${nm[m[1]] || m[1]} ${+m[2]}` : ({ Loading: 'завантаження', Lobby: 'лобі', Menu: 'меню' }[p] || p || '—'); };

let cur = K.order[0];
$('#selBuild').innerHTML = K.order.map(v => `<option value="${v}">${bname(v)} · ${d2(K.data[v].born)}</option>`).join('');
$('#selBuild').onchange = e => { cur = e.target.value; render(); };

function render() {
  const R = K.data[cur], H = K.health, P = R.prev ? bname(R.prev) : null;
  // ---- шапка й банер
  const dataTip = `Архів: сесії з ${d2(H.ch_start)}, події з ${d2(H.events_start)}, логи помилок з ${d2(H.loki_start)} · ${num(H.archive_mb)} МБ. Прод-білд = від ${K.thresholds.prod_min_players} гравців за перші 7 днів; не враховано: ${H.others.map(o => `${o.build} (${o.players7})`).join(', ')}.`;
  $('#hsub').innerHTML = `<span title="${esc(dataTip)}">дані на ${dt(Math.min(H.ch_last, H.pg_last, H.loki_last))}</span>${K.grafana_url ? ` · <a class="ext" href="${K.grafana_url}" target="_blank">Grafana</a>` : ''} · <a class="ext" href="${K.unity_url}/cloud-diagnostics/crashes-exceptions" target="_blank">Unity</a>`;
  $('#banner').innerHTML = H.issues.length ? `<div class="banner"><b>Дані застаріли:</b> ${H.issues.map(i => i.pct != null ? `${i.what} — ${pct(i.pct)}` : `${i.what} — ${i.ts ? 'останні від ' + dt(i.ts) : 'немає'}${i.manual ? ' (знімок оновлюється вручну)' : ''}`).join('; ')}</div>` : '';

  // ---- вердикт
  const sigs = [['s1', 'аварійні завершення'], ['s2', "обриви з'єднання"], ['s3', 'фризи']];
  const bad = st => sigs.filter(([k]) => R[k].status === st).map(([, n]) => n).join(', ');
  const C = R.checks;
  let title;
  if (R.overall === 'critical') title = `Нестабільний: ${bad('critical')}`;
  else if (R.signals === 'warning') title = `Є погіршення: ${bad('warning')}`;
  else if (R.overall === 'grey') title = R.prev && !R.prev_events_ok ? `Немає з чим порівняти краші й обриви` : 'Рано судити — мало даних';
  else title = `Стабільний — гірше не стало${R.overall === 'warning' ? ', але є що перевірити' : ''}`;
  const sub = [P ? `проти ${P}` : 'попереднього прод-білда немає', `перші ${age(R.span_h)} життя кожного`, nw(R.players, 'гравець', 'гравці', 'гравців')];
  if (R.lag) sub.push('дані ще доповнюються');
  if (R.prev && !R.prev_events_ok) sub.push(`у ${P} ще не було телеметрії крашів і обривів`);
  const links = [];
  if (C.new_errors) links.push(`<a href="#errSec" data-tab="new">${nw(C.new_errors, 'нова помилка', 'нові помилки', 'нових помилок')} ↓</a>`);
  if (C.stuck) links.push(`<a href="#repSec">${nw(C.stuck, 'репорт', 'репорти', 'репортів')} про застрягання ↓</a>`);
  if (C.error_rise) links.push(`<a href="#errSec">помилки в логах у ${pct(R.errors.players_pct, 0)} гравців (було ${pct(R.errors.base_pct, 0)}) ↓</a>`);
  $('#verdict').innerHTML = `<div class="verdict ${R.overall}"><h2>${esc(title)}</h2><div class="sub">${sub.join(' · ')}</div>${links.length ? `<div class="links">${links.join('')}</div>` : ''}</div>`;
  document.querySelectorAll('[data-tab]').forEach(a => a.onclick = () => { tab = a.dataset.tab; renderErrors(); });

  // ---- плитки
  const ciTip = (S, unit) => S.ci ? `${num(S.n)} ${unit}; з 95 % імовірністю справжнє значення ${num(S.ci[0], 1)}–${num(S.ci[1], 1)} %` : '';
  const limTip = (S, lower) => S.limit_warn == null ? 'Немає з чим порівняти або замало даних' : lower
    ? `Норма — не нижче ${num(S.limit_warn, 1)} %. Проблема — ${num(S.limit_crit, 1)} % і нижче. Пороги відносно ${P}.`
    : `Норма — до ${num(S.limit_warn, 1)} %. Проблема — від ${num(S.limit_crit, 1)} %. Пороги відносно ${P}.`;
  const delta = (S, d = 1) => {
    if (S.base == null) return `<span class="muted">${P ? `у ${P} даних немає` : 'попереднього білда немає'}</span>`;
    const diff = S.value - S.base; if (Math.abs(diff) < Math.pow(10, -d) / 2) return `<span class="muted">без змін проти ${P}</span>`;
    const worse = diff > 0;   // усі три показники: більше = гірше
    return `<span class="${worse ? 'worse-mark' : 'better-mark'}">${worse ? '▲' : '▼'} ${num(Math.abs(diff), d)} п.п. ${worse ? 'гірше' : 'краще'}</span> <span class="muted">ніж у ${P}</span>`;
  };
  const cmpBars = (S, d = 1) => {
    if (S.base == null) return '';
    const mx = Math.max(S.value, S.base, S.limit_crit || 0, S.limit_warn || 0) * 1.08 || 1;
    const w = v => Math.max(2, Math.round(100 * v / mx));
    const tick = S.limit_warn != null ? `<span class="ctick" style="left:${w(S.limit_warn)}%" title="поріг: норма до ${num(S.limit_warn, 2)} %"></span>` : '';
    return `<div class="cbars">
      <div class="cb"><span class="cl">${shortc(cur)}</span><span class="ctrack"><span class="cfill cur" style="width:${w(S.value)}%"></span>${tick}</span><span class="cv">${num(S.value, d)} %</span></div>
      <div class="cb"><span class="cl">${shortc(R.prev)}</span><span class="ctrack"><span class="cfill prev" style="width:${w(S.base)}%"></span>${tick}</span><span class="cv muted">${num(S.base, d)} %</span></div></div>`;
  };
  const kv = rows => rows.map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('');
  const s1 = R.s1, s2 = R.s2, t = R.s3.show, s3 = t ? R.s3.tiers[t] : null;
  const was = (v, b) => `${pct(v)}${b != null ? ` <span class="muted">(було ${num(b, 1)})</span>` : ''}`;
  // Crash rate = обернене до «запусків без аварійних завершень»: так краші подають у Crashlytics / Unity / Steam
  const inv = v => v == null ? null : 100 - v;
  const cr = { ...s1, value: inv(s1.value), base: inv(s1.base), limit_warn: inv(s1.limit_warn), limit_crit: inv(s1.limit_crit),
               ci: s1.ci ? [inv(s1.ci[1]), inv(s1.ci[0])] : null };
  const tiles = [
    `<div class="tile st-${s1.status}"><div class="top"><span title="Crash rate: частка запусків, після яких гра наступного разу повідомила про аварійне завершення або зависання (подія previous_exit, kind = unclean / quit_stalled). Хто після крашу не повернувся — не врахований. Джерело: власна телеметрія (Postgres).">Crash rate <span class="muted small">· аварійні завершення</span></span>${pill(s1.status, limTip(cr, false))}</div>
      <div class="val" title="${esc(ciTip(cr, 'запусків, аварійних ' + num(s1.bad)))}">${num(cr.value, 2)}<small> %</small></div><div class="delta">${delta(cr, 2)}</div>${cmpBars(cr, 2)}
      <details><summary>де сталися</summary>${kv(Object.entries(s1.by_phase).sort((a, b) => b[1] - a[1]).map(([k, v]) => [PHASE[k] || k, num(v)])) || '<div class="kv"><span>—</span></div>'}</details></div>`,
    `<div class="tile st-${s2.status}"><div class="top"><span title="Disconnect rate: частка завершень сесії обривом (session:end:Disconnect) серед штатних і обривів. Норма = не гірше за попередній прод-білд. «Обрив» — усе, причину чого гра не знає, не лише мережа. Джерело: власна телеметрія (Postgres).">Disconnect rate <span class="muted small">· обриви з'єднання</span></span>${pill(s2.status, limTip(s2, false))}</div>
      <div class="val" title="${esc(ciTip(s2, 'завершень, обривів ' + num(s2.dc)))}">${num(s2.value, 1)}<small> %</small></div><div class="delta">${delta(s2)}</div>${cmpBars(s2)}
      <details><summary>де сталися</summary>${kv([['соло', was(s2.solo.value, s2.solo.base)], ['кооп', was(s2.coop.value, s2.coop.base)],
        ['<span title="У ClickHouse немає підсумку цієї сесії, тож соло чи кооп — невідомо; майже всі такі завершення — обриви до старту гри">сесія без підсумку</span>', was(s2.none.value, s2.none.base)], ['з них у лобі / на завантаженні', was(s2.entry_pct, s2.entry_base)]])}
        <div class="kv" style="margin-top:6px"><span class="small muted">найчастіше</span></div>${kv(Object.entries(s2.by_place).map(([k, v]) => [PLACE(k), num(v)]))}</details></div>`,
    s3 ? `<div class="tile st-${s3.status}"><div class="top"><span title="Hitch rate: частка ігрового часу з кадром довше 30 мс (seconds_hitch_30 / seconds_steady), окремо по групі заліза (hw_tier). Показано групу з найгіршим станом, а якщо все в нормі — найчисельнішу. Джерело: власна телеметрія (ClickHouse, session_level_perf).">Hitch rate <span class="muted small">· фризи, ${TIER[t]}</span></span>${pill(s3.status, limTip(s3, false))}</div>
      <div class="val" title="${esc(num(s3.rows) + ' відвідувань рівнів')}">${num(s3.value, 1)}<small> %</small></div><div class="delta">${delta(s3)}</div>${cmpBars(s3)}
      <details><summary title="${esc(TIER_TIP)}">усі групи заліза <span class="muted">(за VRAM, ?)</span></summary>${kv(Object.entries(R.s3.tiers).map(([k, T]) => [TIER[k], `${was(T.value, T.base)} ${T.base != null && Math.abs(T.value - T.base) >= 0.05 ? `<span class="${T.value > T.base ? 'worse-mark' : 'better-mark'}">${T.value > T.base ? '▲' : '▼'}</span>` : ''} ${T.status === 'good' || T.status === 'grey' ? '' : pill(T.status)}`]))}</details></div>`
       : `<div class="tile"><div class="top"><span>Hitch rate</span>${pill('grey')}</div><div class="val">—</div></div>`,
  ];
  $('#tiles').innerHTML = tiles.join('');

  renderStability(); renderErrors(); renderReports(); renderCmp();
}

// ---- Стабільність по білдах: головний графік (перемикач метрики, по білдах / по днях), adoption, таблиця білдів
const ST = { metric: 'crash', mode: 'builds', tier: null };
try { Object.assign(ST, JSON.parse(localStorage.getItem('lp-stability') || '{}')); } catch (e) {}
const saveST = () => { try { localStorage.setItem('lp-stability', JSON.stringify(ST)); } catch (e) {} };
const METRICS = {
  crash: { label: 'Crash rate', unit: '% запусків', d: 2, tip: 'аварійні завершення серед запусків' },
  dc: { label: 'Disconnect rate', unit: '% завершень сесій', d: 1, tip: "обриви з'єднання серед штатних і обривів" },
  hitch: { label: 'Hitch rate', unit: '% ігрового часу', d: 1, tip: 'час із кадром довше 30 мс, по групі заліза' },
  err: { label: 'Exceptions', unit: '% гравців', d: 0, tip: 'гравців із хоча б однією exception у логах' },
};
const hatchDef = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="2"/></pattern></defs>`;
const niceMax = v => { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; const n = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => m <= x); return n * p; };

function tierFor(R) { return ST.tier && R.s3.tiers[ST.tier] ? ST.tier : (R.s3.show || Object.keys(R.s3.tiers)[0] || 'high'); }

function limitsFor(R, metric, tier) {        // пороги обраного білда у шкалі графіка
  if (metric === 'crash') { const s = R.s1; return s.limit_warn == null ? null : { warn: 100 - s.limit_warn, crit: 100 - s.limit_crit }; }
  if (metric === 'dc') { const s = R.s2; return s.limit_warn == null ? null : { warn: s.limit_warn, crit: s.limit_crit }; }
  if (metric === 'hitch') { const s = R.s3.tiers[tier]; return !s || s.limit_warn == null ? null : { warn: s.limit_warn, crit: s.limit_crit }; }
  if (metric === 'err') { const b = R.errors.base_pct; return b == null ? null : { warn: b * (1 + K.thresholds.exc_warn_pct / 100), crit: null }; }
  return null;
}

function renderStability() {
  const R = K.data[cur], O = K.overview, T = K.timeline;
  if (!O || !O.rows || O.rows.length < 2) { $('#stSec').hidden = true; return; }
  $('#stSec').hidden = false;
  const tier = tierFor(R), M = METRICS[ST.metric];
  // шапка: перемикачі
  $('#stH').innerHTML = `Стабільність по білдах <span class="aside">${ST.mode === 'builds' ? `кожен білд — за перші ${age(O.span_h)} життя` : `останні ${T.days} дн. по днях (UTC)`}</span>`;
  $('#stCtl').innerHTML = `<div class="seg" id="segM">${Object.entries(METRICS).map(([k, m]) => `<button data-m="${k}" class="${ST.metric === k ? 'on' : ''}" title="${esc(m.tip)}">${m.label}</button>`).join('')}</div>` +
    (ST.metric === 'hitch' ? `<select id="selTier" aria-label="Група заліза" title="${esc(TIER_TIP)}">${Object.keys(R.s3.tiers).map(t => `<option value="${t}" ${t === tier ? 'selected' : ''}>${TIER[t]}</option>`).join('')}</select>` : '') +
    `<div class="seg" id="segMode"><button data-mode="builds" class="${ST.mode === 'builds' ? 'on' : ''}">по білдах</button><button data-mode="days" class="${ST.mode === 'days' ? 'on' : ''}">по днях</button></div>`;
  document.querySelectorAll('#segM button').forEach(b => b.onclick = () => { ST.metric = b.dataset.m; saveST(); renderStability(); });
  document.querySelectorAll('#segMode button').forEach(b => b.onclick = () => { ST.mode = b.dataset.mode; saveST(); renderStability(); });
  const ts = $('#selTier'); if (ts) ts.onchange = e => { ST.tier = e.target.value; saveST(); renderStability(); };

  const lim = limitsFor(R, ST.metric, tier);
  $('#stMain').innerHTML = ST.mode === 'builds' ? chartBuilds(R, O, tier, M, lim) : chartDays(R, T, tier, M, lim);
  $('#stAdopt').innerHTML = chartAdoption(T);
  renderBuildTable(R, O, tier);
}

// значення метрики для рядка overview / дня таймлайну
const ovVal = (r, metric, tier) => metric === 'crash' ? (r.s1 == null ? null : 100 - r.s1) : metric === 'dc' ? r.s2 : metric === 'hitch' ? (r.s3 || {})[tier] ?? null : r.err_pct;
const ovN = (r, metric, tier) => metric === 'crash' ? r.s1_n : metric === 'dc' ? r.s2_n : metric === 'hitch' ? (r.s3_n || {})[tier] : r.players;
const ovCI = (r, metric) => metric === 'crash' ? (r.s1_ci ? [100 - r.s1_ci[1], 100 - r.s1_ci[0]] : null) : metric === 'dc' ? r.s2_ci : null;
const dayVal = (b, metric, tier) => !b ? null : metric === 'crash' ? b.crash : metric === 'dc' ? b.dc : metric === 'hitch' ? (b.hitch || {})[tier] ?? null : b.err;
const dayN = (b, metric, tier) => !b ? 0 : metric === 'crash' ? b.launches : metric === 'dc' ? b.ends : metric === 'hitch' ? (b.perf_rows || {})[tier] || 0 : b.players;

function frame(W, H, L, R, Tp, B, max, unit, d) {
  const y = v => Tp + (H - Tp - B) * (1 - v / max);
  const step = max / 4;
  const ticks = [0, 1, 2, 3, 4].map(i => { const v = i * step; return `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${num(v, v % 1 ? Math.min(d, 1) : 0)}</text>`; }).join('');
  return { y, ticks: ticks + `<text class="axis unit" x="${L - 6}" y="${Tp - 8}" text-anchor="end">${esc(unit)}</text>` };
}

function thresholdLayer(lim, y, L, W, R, max) {
  if (!lim) return '';
  let s = '';
  if (lim.crit != null && lim.crit <= max) s += `<rect x="${L}" width="${W - L - R}" y="${y(Math.min(max, 1e9))}" height="${y(lim.crit) - y(max)}" fill="var(--critical)" opacity="0.07"/>`;
  if (lim.warn != null && lim.warn <= max) s += `<line class="thr" x1="${L}" x2="${W - R}" y1="${y(lim.warn)}" y2="${y(lim.warn)}"/><text class="thr-l" x="${L + 6}" y="${y(lim.warn) - 5}" text-anchor="start">норма до ${num(lim.warn, 2)} %</text>`;
  return s;
}

function chartBuilds(R, O, tier, M, lim) {
  const seq = [...O.rows].reverse(), n = seq.length, W = 960, H = 260, L = 56, Rr = 16, Tp = 30, B = 44, iw = (W - L - Rr) / n, x = i => L + iw * (i + 0.5);
  const vals = seq.map(r => ovVal(r, ST.metric, tier)), cis = seq.map(r => ovCI(r, ST.metric));
  const present = vals.filter(v => v != null);
  if (!present.length) return `<div class="chart empty-chart">Для цієї метрики ще немає даних ні по одному прод-білду.</div>`;
  const hi = Math.max(...present, ...cis.filter(Boolean).map(c => c[1]), lim ? (lim.crit || lim.warn) : 0);
  const max = niceMax(hi * 1.15);
  const { y, ticks } = frame(W, H, L, Rr, Tp, B, max, M.unit, M.d);
  const ci = seq.findIndex(r => r.build === cur);
  let body = hatchDef;
  // зона без телеметрії (суцільний ряд порожніх білдів зліва)
  let firstData = vals.findIndex(v => v != null);
  if (firstData > 0) body += `<rect x="${L}" width="${iw * firstData}" y="${Tp}" height="${H - Tp - B}" fill="url(#hatch)" opacity="0.6"/><text class="axis" x="${L + iw * firstData / 2}" y="${Tp + (H - Tp - B) / 2}" text-anchor="middle">телеметрії ще не було</text>`;
  if (ci >= 0) body += `<rect class="cur-band" x="${x(ci) - iw / 2}" width="${iw}" y="${Tp}" height="${H - Tp - B}" rx="6"/>`;
  body += ticks + thresholdLayer(lim, y, L, W, Rr, max);
  let d = '', pen = false;
  seq.forEach((r, i) => { const v = vals[i]; if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true; });
  body += `<path class="ln main" d="${d}"/>`;
  seq.forEach((r, i) => {
    const v = vals[i]; if (v == null) return;
    const c = cis[i]; const isCur = r.build === cur;
    const st = lim ? (lim.crit != null && v >= lim.crit ? 'critical' : v >= lim.warn ? 'warning' : 'good') : 'none';
    if (c) body += `<line class="ci" x1="${x(i)}" x2="${x(i)}" y1="${y(c[0])}" y2="${y(c[1])}"/>`;
    body += `<circle cx="${x(i)}" cy="${y(v)}" r="${isCur ? 7 : 4.5}" class="pt ${st}" data-b="${r.build}"><title>${bname(r.build)} · ${d2(r.born)}: ${num(v, M.d)} % з ${num(ovN(r, ST.metric, tier))}${c ? ` · 95 % ${num(c[0], M.d)}–${num(c[1], M.d)}` : ''}</title></circle>`;
    body += isCur ? `<text class="vlabel" x="${x(i)}" y="${y(v) - 14}" text-anchor="middle">${num(v, M.d)} %</text>`
                  : `<text class="vl" x="${x(i)}" y="${y(v) - 10}" text-anchor="middle">${num(v, M.d)} %</text>`;
  });
  body += seq.map((r, i) => `<text class="xb ${r.build === cur ? 'cur' : ''}" x="${x(i)}" y="${H - 24}" text-anchor="middle">${shortc(r.build)}</text><text class="xb2" x="${x(i)}" y="${H - 9}" text-anchor="middle">${d2(r.born)}</text>`).join('');
  return `<div class="chart big"><svg viewBox="0 0 ${W} ${H}">${body}</svg></div>`;
}

function chartDays(R, T, tier, M, lim) {
  const rows = T.rows, n = rows.length, W = 960, H = 260, L = 56, Rr = 16, Tp = 30, B = 34, iw = (W - L - Rr) / n, x = i => L + iw * (i + 0.5);
  const today = Math.floor(K.generated / 86400) * 86400;
  const prev = R.prev, colored = [cur, prev].filter(Boolean);
  const series = T.series;
  const val = (r, v) => dayVal(r.b[v], ST.metric, tier);
  const bornDay = v => T.born[v] != null ? Math.floor(T.born[v] / 86400) * 86400 : -1;
  const partial = (r, v) => r.day === today || (ST.metric === 'crash' && r.day === bornDay(v));
  const hi = Math.max(0, lim ? (lim.crit || lim.warn) : 0, ...rows.flatMap(r => colored.filter(v => !partial(r, v)).map(v => val(r, v)).filter(v => v != null)));
  if (!(hi > 0)) return `<div class="chart empty-chart">Для ${bname(cur)} ще немає денних значень цієї метрики (потрібно від ${T.min_n} спостережень за день).</div>`;
  const max = niceMax(hi * 1.15);
  const { y, ticks } = frame(W, H, L, Rr, Tp, B, max, M.unit, M.d);
  let body = `<defs><clipPath id="clip"><rect x="${L}" y="${Tp}" width="${W - L - Rr}" height="${H - Tp - B}"/></clipPath></defs>` + ticks + thresholdLayer(lim, y, L, W, Rr, max);
  Object.entries(T.born).forEach(([v, b]) => { const i = rows.findIndex(r => r.day === Math.floor(b / 86400) * 86400); if (i >= 0)
    body += `<line class="rel" x1="${x(i)}" x2="${x(i)}" y1="${Tp}" y2="${H - B}"/><text class="rel-l" x="${x(i) + 4}" y="${Tp + 12}">${shortc(v)}</text>`; });
  const order = [...series.filter(v => !colored.includes(v)), ...colored.slice().reverse()];   // кольорові малюємо поверх
  // підписи значень обраного й попереднього білда: вищу точку дня підписуємо над нею, нижчу — під нею
  let labels = '';
  rows.forEach((r, i) => { const vs = colored.map(v => [v, val(r, v)]).filter(([, q]) => q != null);
    vs.forEach(([v, q]) => { const below = vs.length > 1 && vs.some(([w, o]) => w !== v && (o > q || (o === q && v !== cur)));
      labels += `<text class="vl ${v === cur ? 'main' : ''}" x="${x(i)}" y="${y(q) + (below ? 16 : -9)}" text-anchor="middle">${num(q, M.d)}</text>`; }); });
  body += `<g clip-path="url(#clip)">`;
  order.forEach(v => {
    const cls = v === cur ? 'main' : v === prev ? 'prev' : 'other';
    let d = '', pen = false, pts = '';
    rows.forEach((r, i) => { const val_ = val(r, v); if (val_ == null) { pen = false; return; }
      d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(val_).toFixed(1)} `; pen = true;
      if (cls !== 'other') pts += `<circle cx="${x(i)}" cy="${y(val_)}" r="${cls === 'main' ? 4.5 : 3.5}" class="pt ${cls} ${partial(r, v) ? 'part' : ''}" style="${partial(r, v) ? 'stroke:' + (cls === 'main' ? 'var(--c1)' : 'var(--c2)') : ''}"><title>${d2(r.day)} · ${bname(v)}: ${num(val_, M.d)} % з ${num(dayN(r.b[v], ST.metric, tier))}${r.day === today ? ' · день неповний' : ''}${ST.metric === 'crash' && r.day === bornDay(v) ? ' · перший день білда: краш видно лише при наступному запуску, значення занижене' : ''}</title></circle>`; });
    body += `<path class="ln ${cls}" d="${d}"><title>${v === 'інші' ? 'інші релізні білди' : v === '0.4.x' ? '0.4.x (стара гілка)' : bname(v)}</title></path>${pts}`;
  });
  body += `</g>` + labels;
  body += rows.map((r, i) => (i % 3 === (n - 1) % 3) ? `<text class="xb2" x="${x(i)}" y="${H - 10}" text-anchor="middle">${d2(r.day)}</text>` : '').join('');
  const legend = `<div class="legend"><span class="lg main">${bname(cur)}</span>${prev ? `<span class="lg prev">${bname(prev)}</span>` : ''}<span class="lg other">інші білди</span>${lim ? '<span class="lg thr">поріг</span>' : ''}<span class="muted">· точка лише від ${T.min_n} спостережень за день · порожня точка = неповний день (сьогодні; для Crash rate ще й перший день білда)</span></div>`;
  return `<div class="chart big">${legend}<svg viewBox="0 0 ${W} ${H}">${body}</svg></div>`;
}

function chartAdoption(T) {
  if (!T || !T.rows.length) return '';
  const rows = T.rows, n = rows.length, W = 960, H = 150, L = 56, Rr = 16, Tp = 10, B = 30, iw = (W - L - Rr) / n, x = i => L + iw * (i + 0.5);
  const series = T.series, colIdx = {}; let ci = 0; series.forEach(v => colIdx[v] = v === 'інші' ? 'var(--c0)' : v === '0.4.x' ? 'var(--ink-2)' : `var(--c${Math.min(++ci, 4)})`);
  const lname = v => v === 'інші' ? 'інші релізні білди' : v === '0.4.x' ? '0.4.x — стара гілка, не оновлюється' : bname(v);
  const y = v => Tp + (H - Tp - B) * (1 - v / 100);
  let body = [0, 50, 100].map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v} %</text>`).join('');
  rows.forEach((r, i) => { const tot = series.reduce((s, v) => s + ((r.b[v] || {}).players || 0), 0); if (!tot) return; let acc = 0;
    series.forEach(v => { const p = (r.b[v] || {}).players || 0; if (!p) return; const sh = 100 * p / tot;
      body += `<rect class="bar" x="${x(i) - iw * 0.42}" width="${iw * 0.84}" y="${y(acc + sh)}" height="${y(acc) - y(acc + sh)}" fill="${colIdx[v]}"><title>${d2(r.day)} · ${lname(v)}: ${num(sh, 0)} % (${num(p)} з ${num(tot)} гравців)</title></rect>`;
      if (y(acc) - y(acc + sh) >= 13) body += `<text class="seg-l" x="${x(i)}" y="${(y(acc) + y(acc + sh)) / 2 + 3.5}" text-anchor="middle">${num(sh, 0)}%</text>`;
      acc += sh; }); });
  body += rows.map((r, i) => (i % 3 === (n - 1) % 3) ? `<text class="xb2" x="${x(i)}" y="${H - 10}" text-anchor="middle">${d2(r.day)}</text>` : '').join('');
  const legend = `<div class="legend">${series.map(v => `<span style="--c:${colIdx[v]}">${lname(v)}</span>`).join('')}</div>`;
  return `<div class="chart big"><div class="ct"><span>Частка гравців на кожному білді, по днях</span><span>чи всі вже переїхали на новий білд; 0.4.x — окрема гілка Steam, вона не переїжджає</span></div>${legend}<svg viewBox="0 0 ${W} ${H}">${body}</svg></div>`;
}

function renderBuildTable(R, O, tier) {
  const rows = O.rows;
  const stCls = (metric, r) => r.build !== cur ? '' : ({ crash: R.s1.status, dc: R.s2.status, hitch: (R.s3.tiers[tier] || {}).status, err: R.checks.error_rise ? 'warning' : (R.errors.base_pct != null ? 'good' : 'grey') }[metric] || '');
  const cell = (v, d, prev, worseUp, metric, r, suffix = ' %') => {
    if (v == null) return '<td class="muted">—</td>';
    const diff = prev == null ? null : v - prev;
    const arrow = diff == null || Math.abs(diff) < Math.pow(10, -d) / 2 ? '' : `<span class="${(diff > 0) === worseUp ? 'worse-mark' : 'better-mark'}">${diff > 0 ? '▲' : '▼'} ${num(Math.abs(diff), d)}</span>`;
    const st = metric ? stCls(metric, r) : '';
    return `<td class="st-${st}">${num(v, d)}${suffix} ${arrow}</td>`;
  };
  const maxPl = Math.max(...rows.map(r => r.players), 1);
  $('#stT').innerHTML = `<tr><th>Білд</th><th>Вийшов</th><th>Гравців</th><th>Crash rate</th><th>Disconnect rate</th><th>Hitch · ${TIER[tier].split(' ')[0]}</th><th>Exceptions</th><th title="помітних сигнатур, яких не було у старіших прод-білдах">Нових помилок</th><th title="гравців із нативним крашем на 1 000, Unity Cloud Diagnostics, 14 дн.">Нативні /1k</th><th title="репорти гравців, Unity User Reporting: усього · топ-категорії">Репорти</th></tr>` +
    rows.map((r, i) => { const p = rows[i + 1] || {};
      return `<tr class="${r.build === cur ? 'cur' : ''}" data-b="${r.build}"><td><b>${short(r.build)}</b> <span class="muted small">${r.build.split('.')[3] ? r.build.split('.')[3].slice(0, 8) : ''}</span></td><td class="muted">${d2(r.born)}</td>
        <td><span class="ibar" style="width:${Math.round(60 * r.players / maxPl)}px"></span>${num(r.players)}</td>
        ${cell(ovVal(r, 'crash'), 2, ovVal(p, 'crash'), true, 'crash', r)}${cell(r.s2, 1, p.s2, true, 'dc', r)}${cell((r.s3 || {})[tier], 1, (p.s3 || {})[tier], true, 'hitch', r)}${cell(r.err_pct, 0, p.err_pct, true, 'err', r)}
        <td>${r.new_count == null ? '<span class="muted">—</span>' : num(r.new_count)}</td><td>${r.native_per_1k == null ? '<span class="muted">—</span>' : num(r.native_per_1k, 1)}</td>
        <td title="${esc(Object.entries(r.report_cats || {}).map(([c, k]) => `${(K.user_reports_cats || {})[c] || c}: ${k}`).join(', '))}">${r.reports ? `<b>${num(r.reports)}</b> <span class="muted small">${Object.entries(r.report_cats || {}).filter(([c]) => !['junk', 'suggestion', 'other'].includes(c)).slice(0, 2).map(([c, k]) => `${((K.user_reports_cats || {})[c] || c).split(' ')[0]} ${k}`).join(' · ')}</span>` : '<span class="muted">—</span>'}</td></tr>`; }).join('');
  document.querySelectorAll('#stT tr[data-b]').forEach(tr => tr.onclick = () => { cur = tr.dataset.b; $('#selBuild').value = cur; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

// ---- помилки
let tab = null;
function renderErrors() {
  const R = K.data[cur], E = R.errors, P = R.prev ? bname(R.prev) : null;
  const newRows = E.rows.filter(r => r.kind === 'new' && r.notable), regRows = E.rows.filter(r => r.kind === 'regression' && r.notable);
  const fixedRows = (E.gone || []).map(g => ({ ...g, kind: 'fixed', players: 0, players_pct: 0, prev_players: g.players, prev_pct: g.players_pct, frames: [], tickets: [], similar: [], message: '', grafana: E.all_url, sessions: 0, lines: 0, delta_pp: null }));
  const counts = { new: newRows.length, regression: regRows.length, fixed: fixedRows.length, all: E.rows.length };
  if (tab === null || !counts[tab]) tab = newRows.length ? 'new' : regRows.length ? 'regression' : 'all';
  $('#errH').innerHTML = `Exceptions у логах гравців <span class="aside">Loki · ${pct(E.players_pct, 0)} гравців${E.base_pct != null ? ` (у ${P}: ${pct(E.base_pct, 0)})` : ''}${E.complete ? '' : ' · логи за частину періоду вже видалені'}</span>${E.all_url ? ` <a class="small ext" href="${E.all_url}" target="_blank">усі в Grafana</a>` : ''}`;
  const sum = [];
  if (E.has_prev) {
    const mods = Object.entries(E.new_by_module || {});
    sum.push(mods.length ? `<b>Нових помітних: ${num(E.new_count)}</b> — ${mods.map(([m, n]) => `${esc(m)} ${n}`).join(', ')}` : '<b>Нових помітних помилок немає.</b>');
  }
  if (E.dynamics) sum.push(`Регресій: <b>${num(E.regression_count || 0)}</b> · виправлених проти ${P}: <b>${num(E.fixed_count || 0)}</b>`);
  else if (P) sum.push(`<span class="muted">Динаміка проти ${P} недоступна: його логи вже видалені з Loki.</span>`);
  $('#errSum').innerHTML = sum.join('<br>');
  const tb = (k, label) => counts[k] ? `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${label} · ${counts[k]}</button>` : `<button disabled title="немає">${label} · 0</button>`;
  $('#errTabs').innerHTML = `<div class="tabs">${tb('new', 'Нові')}${tb('regression', 'Регресії')}${tb('fixed', 'Виправлені')}${tb('all', 'Усі')}</div>
    <div class="small muted" style="margin:-2px 0 8px">Нові — не було в жодному старішому прод-білді · Регресії — у ${P || 'попередньому'} не було, у старіших була · Виправлені — у ${P || 'попередньому'} була, зараз немає · помітна = від ${K.thresholds.new_min_players} гравців або 1 %</div>`;
  document.querySelectorAll('#errTabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderErrors(); });
  const rows = tab === 'new' ? newRows : tab === 'regression' ? regRows : tab === 'fixed' ? fixedRows : E.rows;
  $('#errList').innerHTML = rows.length ? rows.map((r, i) => {
    const name = r.frame ? r.frame.split('.').slice(-2).join('.') : 'Без кадру з коду гри';
    const meta = [r.etype, r.message].filter(Boolean).join(': ');
    const unity = r.unity ? `<a class="ext" href="${r.unity.url}" target="_blank" title="${r.unity.grouped ? 'Unity зводить усі NullReferenceException з рушія в одну проблему' : 'Проблема в Unity Cloud Diagnostics'}${r.unity.tags ? ' · тег ' + esc(r.unity.tags) : ''}">Unity${r.unity.grouped ? ' (зведена)' : ''}</a>` : '';
    const tk = r.tickets.map(t => `<a class="ticket" href="${t.url}" target="_blank" title="${esc(t.title)} · ${esc(t.state)}">${t.id}</a>`).join(' ') ||
               r.similar.map(t => `<a class="similar" href="${t.url}" target="_blank" title="Можливий збіг за назвою класу: ${esc(t.title)} · ${esc(t.state)}">схоже: ${t.id}</a>`).join(' ');
    let dyn = '';
    if (r.kind === 'fixed') dyn = `<span class="better-mark">у ${P}: ${num(r.prev_players)} гравців · ${pct(r.prev_pct, 0)} · зараз не зустрічається</span>`;
    else if (E.dynamics && r.delta_pp != null) {
      if (r.new || !r.prev_players) dyn = `<span class="muted">у ${P} не було</span>`;
      else { const up = r.delta_pp > 0.05, down = r.delta_pp < -0.05;
        dyn = `<span class="${up ? 'worse-mark' : down ? 'better-mark' : 'muted'}" title="у ${P}: ${num(r.prev_players)} гравців · ${pct(r.prev_pct, 1)}">${up ? '▲' : down ? '▼' : '='} ${pp(r.delta_pp) || 'без змін'} <span class="muted">(було ${pct(r.prev_pct, 0)})</span></span>`; }
    }
    return `<div class="item" title="${esc(`${num(r.sessions)} сесій · ${num(r.lines)} записів`)}">
      <div class="main">${r.kind === 'new' ? '<span class="tag new">НОВА</span>' : r.kind === 'regression' ? '<span class="tag reg">РЕГРЕСІЯ</span>' : r.kind === 'fixed' ? '<span class="tag fixedt">ВИПРАВЛЕНА</span>' : ''}${r.grafana ? `<a class="title" href="${r.grafana}" target="_blank" title="${esc(r.frame || 'Відкрити в Grafana')}">${esc(name)}</a>` : `<span class="title" title="${esc(r.frame || '')}">${esc(name)}</span>`}<span class="tag mod" title="модуль гри з кадру стеку">${esc(r.module)}</span><div class="meta">${esc(meta)}</div></div>
      <div><div class="num">${r.kind === 'fixed' ? '' : `<b>${num(r.players)}</b> <span>· ${pct(r.players_pct, 0)}</span>`}${dyn ? `<div class="small">${dyn}</div>` : ''}</div>
        <div class="side">${tk}${unity}${r.frames.length ? `<button class="linkbtn" data-s="${i}">стек</button>` : ''}</div></div>
      <div class="stack" id="st${i}" hidden>${esc(r.frames.join('\n'))}</div></div>`;
  }).join('') : `<div class="empty">${({ new: 'Нових помилок немає.', regression: 'Регресій немає.', fixed: `Проти ${P} жодна помітна помилка не зникла.` })[tab] || 'Помилок у логах немає.'}</div>`;
  document.querySelectorAll('#errList [data-s]').forEach(b => b.onclick = () => { const s = $('#st' + b.dataset.s); s.hidden = !s.hidden; });
}

// ---- репорти
let repAll = false; const repOpen = new Set();
function renderReports() {
  const CATS = K.user_reports_cats || {}, PRI = ['crash', 'softlock', 'coop', 'items', 'physics', 'balance', 'audio', 'controls', 'performance', 'other', 'suggestion', 'junk'];
  const R = K.data[cur], items = [...R.reports].sort((a, b) => (PRI.indexOf(a.cat) - PRI.indexOf(b.cat)) || (a.t < b.t ? 1 : -1));
  const cc = {}; items.forEach(x => cc[x.cat] = (cc[x.cat] || 0) + 1);
  $('#repH').innerHTML = `Репорти гравців <span class="aside">Unity User Reporting · ${num(items.length)}</span>`;
  $('#repSum').innerHTML = items.length ? PRI.filter(c => cc[c]).map(c => `<span class="cat ${c}">${CATS[c] || c} <b>${cc[c]}</b></span>`).join('') + `<span class="muted small" style="margin-left:8px">категорія — за словами репорту, перевірте вручну</span>` : '';
  const cat = c => ({ 'Performance Issue': 'продуктивність', Suggestion: 'пропозиція' }[c] || '');
  const list = repAll ? items : items.slice(0, 10);
  $('#repList').innerHTML = items.length ? list.map(x => {
    const tk = x.tickets.map(t => `<a class="ticket" href="${t.url}" target="_blank" title="${esc(t.title)} · ${esc(t.state)}">${t.id}</a>`).join(' ') ||
               x.similar.map(t => `<a class="similar" href="${t.url}" target="_blank" title="Збіг за словами ${esc((t.hit || []).join(', '))}: ${esc(t.title)} · ${esc(t.state)}">схоже: ${t.id} <span class="muted">${esc(t.state)}</span></a>`).join(' ');
    const open = repOpen.has(x.id), desc = (x.description || '').trim();
    const extra = [x.gpu ? `GPU: ${esc(x.gpu)}` : '', x.screenshots ? `скріншотів: ${x.screenshots} (в Unity)` : '', x.version ? `версія ${esc(x.version)}` : ''].filter(Boolean).join(' · ');
    return `<div class="item rep ${open ? 'open' : ''}" data-r="${esc(x.id)}"><div class="main" role="button" tabindex="0" aria-expanded="${open}" title="Розгорнути опис"><span class="chev">▸</span><span class="tag cat-${x.cat}" title="категорія за словами репорту">${esc((CATS[x.cat] || x.cat).toUpperCase())}</span><span class="title">${esc(x.summary || 'без назви')}</span>
      <div class="meta">${d2(Date.parse(x.t) / 1000)}${cat(x.category) ? ' · ' + cat(x.category) : ''}<span class="prev">${desc && desc !== (x.summary || '').trim() ? ' · ' + esc(desc.slice(0, 140)) : ''}</span></div></div>
      <div class="side">${tk}<a class="ext" href="${x.url}" target="_blank">Unity</a></div>
      <div class="rep-d" ${open ? '' : 'hidden'}>${desc ? esc(desc) : '<span class="muted" style="margin:0">Гравець не написав опису.</span>'}${extra ? `<span class="muted">${extra}</span>` : ''}</div></div>`;
  }).join('') + (items.length > 10 ? `<button class="more" id="repMore">${repAll ? 'Згорнути' : `Показати ще ${items.length - 10}`}</button>` : '') : '<div class="empty">Репортів по цьому білду немає.</div>';
  const m = $('#repMore'); if (m) m.onclick = () => { repAll = !repAll; renderReports(); };
  document.querySelectorAll('#repList .rep > .main').forEach(el => {
    const toggle = () => { const it = el.parentElement, id = it.dataset.r, open = !repOpen.has(id);
      open ? repOpen.add(id) : repOpen.delete(id); it.classList.toggle('open', open); el.setAttribute('aria-expanded', open); it.querySelector('.rep-d').hidden = !open; };
    el.onclick = e => { if (!e.target.closest('a')) toggle(); };
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }; });
}

// ---- детальне порівняння
function renderCmp() {
  const R = K.data[cur], P = R.prev ? bname(R.prev) : null, D = R.details, B = R.prev_details || {};
  $('#cmp').hidden = !R.prev;
  if (!R.prev) return;
  $('#cmpH').textContent = `Детальне порівняння з ${P}`;
  const row = (name, a, b, unit, d, st, cls = '') => {
    const diff = a != null && b != null ? a - b : null;
    const ds = diff == null ? '—' : Math.abs(diff) < Math.pow(10, -d) / 2 ? 'без змін' : `${diff > 0 ? '+' : '−'}${num(Math.abs(diff), d)}${unit === '%' ? ' п.п.' : ' ' + unit}`;
    const f = v => v == null ? '—' : `${num(v, d)}${unit === '%' ? ' %' : ' ' + unit}`;
    return `<tr class="${cls}"><td>${name}</td><td>${f(a)}</td><td>${f(b)}</td><td class="${st === 'warning' || st === 'critical' ? 'worse' : ''}">${ds}</td></tr>`;
  };
  const pn = K.data[R.prev] && K.data[R.prev].native;
  const T = R.s3.tiers;
  $('#cmpT').innerHTML = `<tr><th>Показник</th><th>${shortc(cur)}</th><th>${shortc(R.prev)}</th><th>Різниця</th></tr>` + [
    row('Запуски без аварійних завершень', R.s1.value, R.s1.base, '%', 1, R.s1.status),
    row("Обриви з'єднання", R.s2.value, R.s2.base, '%', 1, R.s2.status),
    row('соло', R.s2.solo.value, R.s2.solo.base, '%', 1, null, 'sub'),
    row('кооп', R.s2.coop.value, R.s2.coop.base, '%', 1, null, 'sub'),
    row('сесія без підсумку (обрив до старту)', R.s2.none.value, R.s2.none.base, '%', 1, null, 'sub'),
    ...['ultra', 'high', 'mid', 'low'].filter(k => T[k]).map(k => row(`Фризи · ${TIER[k]}`, T[k].value, T[k].base, '%', 1, T[k].status)),
    row('Помилки в логах (частка гравців)', R.errors.players_pct, R.errors.base_pct, '%', 0, R.checks.error_rise ? 'warning' : null),
    row('Час до гри, типовий', D.ttg_p50_s, B.ttg_p50_s, 'с', 0),
    row('Час до гри, найгірші 5 %', D.ttg_p95_s, B.ttg_p95_s, 'с', 0),
    row('Пінг, типовий', D.ping_p50, B.ping_p50, 'мс', 0),
    row('Пінг, найгірші 5 %', D.ping_p95, B.ping_p95, 'мс', 0),
    row('Вийшли до 5 хв', D.early_quit_pct, B.early_quit_pct, '%', 1),
    row('Нативні краші Unity, на 1 000 гравців <span class="muted small">(14 дн., не за фазою життя)</span>', R.native && R.native.per_1k, pn && pn.per_1k, '', 1),
    row('Гравців', R.players, R.prev_players, '', 0),
  ].join('');
}
render();
if (location.hash === '#errSec') document.getElementById('errSec').scrollIntoView();

// ---- тема: світла / темна (за замовчуванням — як у системі; вибір пам'ятає браузер)
(function () {
  const btn = $('#themeBtn'), mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  const eff = () => document.documentElement.dataset.theme || (mq && mq.matches ? 'dark' : 'light');
  const paint = () => { const d = eff() === 'dark'; btn.textContent = d ? '☀' : '☾'; btn.title = d ? 'Світла тема' : 'Темна тема'; btn.setAttribute('aria-label', btn.title); };
  btn.onclick = () => { const t = eff() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('bh-theme', t); } catch (e) {} paint(); };
  if (mq && mq.addEventListener) mq.addEventListener('change', paint);
  paint();
})();
</script>
